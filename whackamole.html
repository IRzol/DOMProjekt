<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylewhack.css">
    <title>Document</title>
</head>
<body class="hatter">
    <nav class="navbar">
        <a href="index.html" class="nav-link aktiv">Dobókocka</a>
        <a href="whackamole.html" class="nav-link">Whack-a-Mole</a>
    </nav>
    <div class="tartalom">
        <table class="tabla">
            <thead>
                <tr>
                    <th><h1 id="ido">30 mp</h1></th>
                    <th><h1 id="pont">Pont: 0</h1></th>
                    <th><h1 id="legtobb">Legtöbb pont: 0</h1></th>
               </tr>
            </thead>
            <tr>
                <td><img id="lyuk1" class="kep" src="lyuk.png" alt=""></td>
                <td><img id="lyuk2" class="kep" src="lyuk.png" alt=""></td>
                <td><img id="lyuk3" class="kep" src="lyuk.png" alt=""></td>
            </tr>
            <tr>
                <td><img id="lyuk4" class="kep" src="lyuk.png" alt=""></td>
                <td><img id="lyuk5" class="kep" src="lyuk.png" alt=""></td>
                <td><img id="lyuk6" class="kep" src="lyuk.png" alt=""></td>
            </tr>
            <tr>
                <td><img id="lyuk7" class="kep" src="lyuk.png" alt=""></td>
                <td><img id="lyuk8" class="kep" src="lyuk.png" alt=""></td>
                <td><img id="lyuk9" class="kep" src="lyuk.png" alt=""></td>
            </tr>
        </table>

        <div class="gomb">
            <input id="start" type="submit" value="Start">
        </div>
    </div>

    <script>
        var gomb = document.getElementById("start");
        var kepek = document.getElementsByClassName("kep");
        var pont = 0;
        var pontKiir = document.getElementById("pont");
        var startolte = false;
        var idokiir = document.getElementById("ido");
        var mp = 45;
        var legtobb = 0;
        var legtobbkiir = document.getElementById("legtobb");
        
        for (let i = 0; i < kepek.length; i++) {
            kepek[i].onclick = function() {
            if (kepek[i].src.includes("hod.png")) {
                pont++;
                pontKiir.innerHTML = "Pont: " + pont;
                
                this.src = "crashout.png"; 
                
                var self = this;
                setTimeout(function() {
                    self.src = "lyuk.png"; 
                }, 300);
            }
        }
        }
        
        gomb.onclick = function(event) 
        {
            event.preventDefault();
            if(startolte == false)
                {
                    gomb.value = "Stop";
                    startolte = true;
                

                    intervalID = setInterval(function() {
                        for (let i = 0; i < kepek.length; i++) {
                            kepek[i].src = "lyuk.png";
                        }
                        var randomszam = Randomizalo();
                        for (let i = 0; i < kepek.length; i++) {
                            if (kepek[i].id == "lyuk" + randomszam) {
                                kepek[i].src = "hod.png";
                            }
                        }
                    }, 1500);

                    intervalTimeID = setInterval(function()
                    {
                        mp -= 1;
                        idokiir.innerHTML = mp + "mp";
                        if (mp <= 0) 
                        {  
                            Leallas();
                        }
                    },1000)
                    
                }
            else
                {
                    Leallas();
                }
        }
        function Leallas()
        {
            gomb.value = "Start";
            startolte = false;
            clearInterval(intervalID);
            clearInterval(intervalTimeID);
            intervalID = null;
            for (let i = 0; i < kepek.length; i++) 
                {
                    kepek[i].src = "lyuk.png";
                }
            mp = 45;
            idokiir.innerHTML = "45mp";
            if (pont > legtobb)
            {
                legtobb = pont;
                legtobbkiir.innerHTML = "Legtöbb pont: " + legtobb;
            }
            pont = 0;
            pontKiir.innerHTML = "Pont: 0";
        }
        function Randomizalo() 
        {
            return Math.floor(Math.random() * 9) + 1;
        }


    </script>
</body>
</html>
